# The knowledge base's half of the API — spec 02 §2.11, §2.12.
#
# Merged into the schema `nav-server` serves rather than concatenated onto it,
# so the `extend` blocks below mean what they say. The merge validates as it
# goes: a fragment extending a type nothing defines fails at startup, naming
# the fault, rather than producing a server that answers one query strangely.

extend type Query {
  "Every feature in the working tree, in slug order (spec 02 §2.11)."
  features: [Feature!]!
  "`slug` is exact: a feature is named by a word somebody chose, not a prefix."
  feature(slug: String!): Feature!
}

extend type Mutation {
  createFeature(input: CreateFeatureInput!): CreateFeaturePayload!
  updateFeature(input: UpdateFeatureInput!): UpdateFeaturePayload!
  addSpec(input: AddSpecInput!): AddSpecPayload!
  updateSpec(input: UpdateSpecInput!): UpdateSpecPayload!
}

# Membership is asserted by the entity (spec 02 §2.11). The interface and both
# implementations are extended together, because a field added to an interface
# must exist on everything that implements it — and the merge checks that.
extend interface Entity {
  "Slugs of the features this entity belongs to (spec 02 §2.11)."
  features: [String!]!
}

extend type Issue {
  features: [String!]!
}

extend type Pr {
  features: [String!]!
}

extend input IssueFilter {
  "Feature slugs; an issue must name every one of them."
  features: [String!]
}

extend input PrFilter {
  "Feature slugs; a pull request must name every one of them."
  features: [String!]
}

extend input OpenIssueInput {
  "Slugs of features to attach it to (spec 02 §2.11)."
  features: [String!]
}

extend input UpdateIssueInput {
  features: [String!]
}

extend input UpdatePrInput {
  features: [String!]
}

"""
A feature: a standing concept work attaches to (spec 02 §2.11).

It has no ID and no status. Its `slug` is the directory that holds it and is
what an entity's `feature` key names; the work attached to it has the status.
"""
type Feature {
  slug: String!
  title: String!
  "RFC 5322 address as stored in frontmatter: `Name <email>`."
  author: String!
  created: String!
  "Markdown summary, trimmed. A feature may have none."
  summary: String!
  "Path from the repository root, e.g. `.navbook/specs/auth`."
  path: String!
  """
  A token for the version of `feature.md` this was read from, computed as
  `Issue.baseSha` is.

  Hand it back as `baseSha` when editing, and an edit made against an older
  version is refused rather than landed on top of somebody else's.
  """
  baseSha: String!
  "Specification documents, in file-name order."
  specs: [Spec!]!
  "Issues naming this feature, newest first, whatever their status."
  issues: [Issue!]!
  "Pull requests naming this feature, newest first."
  prs: [Pr!]!
  """
  Commits that touched this feature, newest first.

  A commit counts when it changed the feature's documents, when it changed the
  directory of an issue or pull request naming the feature, or when its message
  references one of those by ID — which is how a commit that only touches code
  joins the story (spec 04 §4.3). Read from the served checkout's history.
  """
  commits(limit: Int! = 100): [Commit!]!
}

"One of a feature's specification documents (spec 02 §2.11)."
type Spec {
  "File name inside the feature's directory, e.g. `login-flow.md`."
  fileName: String!
  title: String!
  "Path from the repository root."
  path: String!
  "Markdown body, trimmed."
  body: String!
  "A token for the version of this file it was read from; see `Feature.baseSha`."
  baseSha: String!
}

input CreateFeatureInput {
  title: String!
  "Directory to file it under; derived from the title when absent."
  slug: String
  "Markdown summary; a feature may have none."
  summary: String
}

type CreateFeaturePayload {
  feature: Feature!
  commit: CommitInfo!
}

input UpdateFeatureInput {
  slug: String!
  title: String
  summary: String
  """
  The `baseSha` the editor started from.

  A save whose file has moved on since is refused with `STALE_CONTENT` rather
  than landed on top of the change that moved it (spec 06 §6.3).
  """
  baseSha: String!
}

type UpdateFeaturePayload {
  feature: Feature!
  commit: CommitInfo!
}

input AddSpecInput {
  "Slug of the feature to add it to."
  feature: String!
  title: String!
  body: String!
  "File to write it to; derived from the title when absent."
  fileName: String
}

type AddSpecPayload {
  feature: Feature!
  spec: Spec!
  commit: CommitInfo!
}

"Fields to change on a document; `title` and `body` are replaced, never cleared."
input UpdateSpecInput {
  feature: String!
  fileName: String!
  title: String
  body: String
  "See `UpdateFeatureInput.baseSha`."
  baseSha: String!
}

type UpdateSpecPayload {
  feature: Feature!
  spec: Spec!
  commit: CommitInfo!
}
