# Serving a static single-page app, which asks for exactly two things.
#
# The first is that routing happens in the browser: a reload on
# /issues/ab12cd34 has to reach the app rather than a 404, which is what the
# 200.html `nuxi generate` emits is for. The second is that config.json is read
# fresh, because it is the file naming the API and a cached copy is a client
# talking to the deployment before this one.

server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;

    # Compressing what is already compressed wastes cycles; the bundle's fonts
    # and images are the bulk of it and are neither.
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
    gzip_vary on;

    # Content-hashed filenames, so the only way to see a new one is to be given
    # a new document that names it.
    location /_nuxt/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # The one file a deployment overwrites, and the first thing the app fetches.
    location = /config.json {
        add_header Cache-Control "no-store" always;
    }

    # $uri/index.html before the fallback, so /issues serves the page that was
    # prerendered for it instead of being redirected to /issues/ first.
    location / {
        try_files $uri $uri/index.html /200.html;
        add_header Cache-Control "no-cache" always;
    }
}
