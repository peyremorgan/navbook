extend type Query {
  """
  What the probe was configured with, and what it has seen.
  """
  srvprobe: SrvProbe!
  """
  The id of the pull request a write to `ref` would go to, through the host's
  own write-target rule.
  """
  srvprobeWriteTarget(ref: ID!): String!
}

type SrvProbe {
  """
  The note the deployment set, or null.
  """
  note: String
  """
  Commit subjects this plugin has been told about, oldest first.
  """
  seen: [String!]!
  """
  Tags read through the frontmatter key this plugin registered.
  """
  tags: [String!]!
  """
  Issue titles, read by running an operation against the served schema.
  """
  issueTitles: [String!]!
  """
  What running an operation the schema does not have answers.
  """
  invalid: [String!]!
}

extend type Mutation {
  """
  Comment on an entity where it lives, through the host's write site.
  """
  srvprobeNote(kind: Kind!, ref: ID!, text: String!): SrvProbeNote!
}

type SrvProbeNote {
  subject: String!
  pushed: Boolean!
  "The branch it was written on, when that was not the served one."
  branch: String
}
