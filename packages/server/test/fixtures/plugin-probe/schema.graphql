extend type Query {
  """
  What the probe was configured with, and what it has seen.
  """
  srvprobe: SrvProbe!
  """
  The id of the pull request a write to `ref` would go to, through the host's
  own write-target rule.
  """
  srvprobeWriteTarget(ref: ID!): String!
}

type SrvProbe {
  """
  The note the deployment set, or null.
  """
  note: String
  """
  Commit subjects this plugin has been told about, oldest first.
  """
  seen: [String!]!
  """
  Tags read through the frontmatter key this plugin registered.
  """
  tags: [String!]!
}
