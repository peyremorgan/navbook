# The Navbook API — spec 06 §6.3.
#
# Every field is projected from `@navbook/core`, and nothing here reimplements
# the format: identity, status and frontmatter are named the way the canonical
# JSON projection names them (spec 04 §4.2), so a client of this schema and a
# reader of `nav --json` are looking at the same thing.
#
# Timestamps are ISO 8601 strings with second precision, as they are on disk.

"""
Fields the loaded plugins contribute, keyed by plugin short name.

The one place this schema promises a shape it does not describe, and it exists
because of what a plugin's web half cannot do. A plugin may add a field to
`Issue` with `extend type Issue`, but a GraphQL fragment cannot be extended:
the host's own list-row fragment is written in this repository and cannot name
a field it has never heard of. So a client that draws a plugin's data on a row
the host fetched has no way to ask for it.

This is that way. The host selects `ext` once, every loaded plugin fills its
own key, and a plugin's component reads `entity.ext.<short>`. The typed fields
stay: `ext.kb.features` and `features` are the same value, and a query written
by the plugin itself should ask for the latter.
"""
scalar JSON

"What issues and pull requests have in common (spec 02 §2.5, §2.7)."
interface Entity {
  id: ID!
  slug: String!
  kind: Kind!
  status: Status!
  """
  Path from the repository root, e.g. `.navbook/issues/open/ab12cd34-slug`.

  The first segment is the repository's Navbook directory, which defaults to
  `.navbook` but is not always named that (spec 02 §2.1).
  """
  path: String!
  "True when the entity lives under the Navbook directory's `archive/` (spec 03 §3.6)."
  archived: Boolean!
  title: String!
  "RFC 5322 address as stored in frontmatter: `Name <email>`."
  author: String!
  created: String!
  labels: [String!]!
  "The `assignee` key, which the format allows to be a scalar or a list."
  assignees: [String!]!
  milestone: String
  "Markdown body, trimmed."
  body: String!
  comments: [Comment!]!
  "What the loaded plugins contribute, keyed by plugin short name."
  ext: JSON!
}

enum Kind {
  ISSUE
  PR
}

"Issues are open or closed; pull requests may also be merged (spec 02 §2.1)."
enum Status {
  OPEN
  CLOSED
  MERGED
}

"""
The statuses an issue can be in, for `IssueFilter`.

`Status` less `MERGED`, which only a pull request reaches: as with the review
terms, asking an issue for it is refused rather than matching nothing.
"""
enum IssueStatus {
  OPEN
  CLOSED
}

"""
What a review says about the revision it names (spec 02 §2.6).

`COMMENT` is the third: a review that judges nothing and records only that its
author read the revision. It satisfies a request for review like the other two
and never counts toward `reviewDecision`.
"""
enum Verdict {
  APPROVE
  REQUEST_CHANGES
  COMMENT
}

enum DiagnosticLevel {
  ERROR
  WARNING
}

"Where an issue stands against its deadline (spec 02 §2.5)."
enum DeadlineState {
  "Wanted on a day now past. Strict: work wanted today is not yet late."
  OVERDUE
  "Wanted on no particular day."
  NONE
}

type Issue implements Entity {
  id: ID!
  slug: String!
  kind: Kind!
  status: Status!
  path: String!
  archived: Boolean!
  title: String!
  author: String!
  created: String!
  labels: [String!]!
  assignees: [String!]!
  milestone: String
  body: String!
  comments: [Comment!]!
  ext: JSON!
  """
  A token for the version of `issue.md` this was read from.

  Opaque: its only contract is that handing it back unchanged names the same
  text. It is shaped like a git blob hash and is not one — git applies
  `.gitattributes` filters and end-of-line conversion that this does not, and
  may use SHA-256 — so the two differ in a repository that configures either.
  `Pr` computes its own the same way, and so should a type a plugin adds.

  Hand it back as `baseSha` when editing a field from a rendered value, and an
  edit made against an older version of that field is refused rather than
  landed on top of somebody else's (see `UpdateIssueInput.baseSha`). Comments
  live in their own files, so the hash does not move when one is added.
  """
  baseSha: String!

  """
  Where the issue sits in the queue; lower first (spec 02 §2.5).

  A position rather than a grade, so the values mean nothing beyond their
  order: any finite number is one, negative and fractional included.
  """
  rank: Float
  "When the work is wanted, `YYYY-MM-DD`. A date, so it carries no zone."
  deadline: String
  "Why the issue was closed, when it is closed and recorded one."
  resolution: String
  "The issue this one duplicates."
  duplicateOf: ID
  "The issue this one is filed under, when its frontmatter names one."
  parent: LinkNode
  "The subtask forest, `depth` levels deep (spec 02 §2.5)."
  subtasks(depth: Int! = 1): [LinkNode!]!
}

"One state of a pull request's branch (spec 02 §2.7)."
type Revision {
  head: String!
  base: String!
  date: String!
}

"How a pull request was merged (spec 02 §2.7)."
type MergedInfo {
  date: String
  by: String
  commit: String
}

type Pr implements Entity {
  id: ID!
  slug: String!
  kind: Kind!
  status: Status!
  path: String!
  archived: Boolean!
  title: String!
  author: String!
  created: String!
  labels: [String!]!
  assignees: [String!]!
  milestone: String
  body: String!
  comments: [Comment!]!
  ext: JSON!
  "A token for the version of `pr.md` this was read from; see `Issue.baseSha`."
  baseSha: String!

  "Branch the pull request proposes to merge into."
  target: String!
  "Branch carrying its commits, when the file records one."
  source: String
  draft: Boolean!
  revisions: [Revision!]!
  merged: MergedInfo
  """
  Branches the cross-ref scan found it on, or the branch a write was just made
  on; empty for a working-tree read.
  """
  refs: [String!]!

  "Who it asks to review, as `reviewer:` records them (spec 02 §2.7)."
  reviewers: [String!]!
  """
  Everyone asked, plus anyone else who reviewed the latest revision, minus the
  author. Derived from the reviews and stored nowhere.
  """
  reviews: [ReviewerState!]!
  """
  What those reviews add up to, counted by `reviewPolicy`. Never a gate: it is
  a reading of the files, and no operation is refused on it (spec 01 §1.7).
  """
  reviewDecision: ReviewDecision!
  "How many approvals stand, against how many the policy asks for."
  approvals: Approvals!

  """
  The commits the latest revision introduces: `base..head`, oldest first.

  Read from the clone's objects rather than from any branch, so a pull request
  found on a fetched branch answers as well as one on the served one. Empty
  for a pull request with no revision recorded. Refused with `MISSING_COMMIT`
  when the clone lacks either commit.
  """
  commits(limit: Int! = 250): CommitRange!
  """
  What the latest revision changes, file by file.

  `base` is the merge base with the target at the time (spec 02 §2.7), so
  this is the diff a forge shows for a pull request, and it stays right after
  the target moves on. Every file is listed; a patch comes inline while the
  diff is of ordinary size, and a file listed without one (`patch: null`) is
  asked for again by `paths`, which answers those files whatever their size,
  cut at a hard limit and marked `truncated` when it is.
  """
  changes(paths: [String!]): Changes!
  """
  The commits of the latest revision that touch the tracker, oldest first,
  each with what it did to which record.

  Read from each commit's subject, when it follows the grammar `--commit`
  writes, and from its own tracker files, whose frontmatter is compared
  before and after (spec 02). Derived and stored nowhere; merges are left
  out. Refused with `MISSING_COMMIT` when the clone lacks either commit.
  """
  activity(limit: Int! = 100): TrackerActivity!
}

"A revision's tracker commits, oldest first."
type TrackerActivity {
  "How many the range holds, whatever the limit kept."
  total: Int!
  commits: [TrackerCommit!]!
}

"A commit that touched the tracker, and what it did there."
type TrackerCommit {
  sha: String!
  subject: String!
  "RFC 5322 address of the commit's author: `Name <email>`."
  author: String!
  "Author date, ISO 8601."
  date: String!
  """
  `open`, `close`, `reopen`, `merge`, `edit`, `update`, `comment`, `review`,
  `request review`, `delete`, `link` or `unlink`. Null when neither the
  subject nor the files say, and the subject is then the best description
  there is — as it is for a commit that touched no issue or pull request.
  """
  verb: String
  """
  The issue or pull request the commit is about. Null when it touched
  neither: only the marker, say, or a plugin's own files.
  """
  kind: Kind
  entity: String
  "The record's title after the commit, or before it for a deletion."
  title: String
  facts: [TrackerFact!]!
  """
  What the commit changed in the tracker's directory. Patches come until the
  whole activity has spent the diff's inline budget; after that a file is
  listed with its counts and `patch: null`.
  """
  files: [ChangedFile!]!
}

"One thing a commit changed about its record."
type TrackerFact {
  "A frontmatter key, or `status`, `description`, `comments`, `verdict`."
  field: String!
  "Null when it was not set before."
  before: String
  "Null when it is no longer set."
  after: String
}

"A commit, as a history walk reports it."
type Commit {
  sha: String!
  subject: String!
  "RFC 5322 address of the commit's author: `Name <email>`."
  author: String!
  "Author date, ISO 8601."
  date: String!
}

"The commits of a revision range, oldest first."
type CommitRange {
  "How many the range holds, whatever the limit kept."
  total: Int!
  commits: [Commit!]!
}

enum ChangeStatus {
  ADDED
  MODIFIED
  DELETED
  RENAMED
  COPIED
}

"The diff of one revision against its merge base."
type Changes {
  base: String!
  head: String!
  "By path, except that the tracker's own files (`tracker: true`) come last."
  files: [ChangedFile!]!
  additions: Int!
  deletions: Int!
}

"One file of a diff, as `git diff` reports it."
type ChangedFile {
  "Path after the change; for a deleted file, the path it had."
  path: String!
  "Where a renamed or copied file came from."
  oldPath: String
  status: ChangeStatus!
  additions: Int!
  deletions: Int!
  binary: Boolean!
  "How many lines the patch holds, whether or not it was sent."
  lines: Int!
  """
  The unified hunks, from the first `@@`, without the file header. Null for a
  binary file, a pure rename or a mode change, and when withheld for size.
  """
  patch: String
  "True when the patch was cut at the server's hard limit."
  truncated: Boolean!
  "True for a file in the tracker's own directory, which `Pr.activity` explains."
  tracker: Boolean!
}

"Approvals counted against the number the review policy asks for."
type Approvals {
  given: Int!
  required: Int!
}

"""
How this repository counts reviews, as its marker declares it (spec 02 §2.10).

Advisory throughout: it changes what the decision counts and what a client may
say about it, never what any operation will do.
"""
type ReviewPolicy {
  "Whether a pull request's own author is counted among its reviewers."
  selfReview: Boolean!
  "How many approvals a decision of APPROVED takes; at least 1."
  minApprovals: Int!
  "False when the marker declares no policy, and these are the defaults."
  declared: Boolean!
  """
  What could not be read, one message per fault; empty when there is nothing
  wrong. A malformed policy defaults rather than failing, so a client showing
  these is showing why the numbers beside them are the defaults (check D15).
  """
  problems: [String!]!
}

"What one person has said about a pull request's latest revision."
type ReviewerState {
  person: String!
  state: ReviewState!
  "True when nobody asked them; their review counts all the same."
  volunteer: Boolean!
  "The review this was read from, absent while they have not answered."
  comment: ID
}

enum ReviewState {
  APPROVE
  REQUEST_CHANGES
  "They read the revision and judged nothing."
  COMMENTED
  "They were asked and have not answered this revision."
  PENDING
}

enum ReviewDecision {
  APPROVED
  CHANGES_REQUESTED
  PENDING
}

"A comment or a review (spec 02 §2.6)."
type Comment {
  id: ID!
  path: String!
  created: String!
  author: String!
  replyTo: ID
  "Set on reviews; a plain comment has none of the four fields below."
  verdict: Verdict
  "The revision the review binds to, as a 40-hex SHA."
  revision: String
  file: String
  "A line number or a `start-end` range, as the format allows."
  line: String
  body: String!
}

"""
One end of a decomposition link.

A link can name something this tree cannot show — an issue on an unfetched
branch, a pull request, a loop — and each of those is a different thing to be
told, so the node is always returned and says which case it is.
"""
type LinkNode {
  id: ID!
  "Absent when the id matches no issue in this tree."
  issue: Issue
  "The id names a pull request, which decomposition never relates (§2.5)."
  notAnIssue: Boolean!
  "The id is an ancestor of itself: the chain loops here."
  cycle: Boolean!
  "Already expanded elsewhere in this response; not expanded again."
  repeated: Boolean!
  children: [LinkNode!]!
}

"One finding of the `doctor` check (spec 04 §4.3)."
type Diagnostic {
  "The check that produced it, D1 through D16, or a plugin's `X-` check."
  check: String!
  level: DiagnosticLevel!
  "Path relative to the Navbook directory, or empty for a repository-wide finding."
  path: String!
  message: String!
  "Whether `nav doctor --fix` could mend it. The server never applies fixes."
  fixable: Boolean!
}

type DoctorReport {
  diagnostics: [Diagnostic!]!
}

"Who the presented token says is acting; what mutations record as `author`."
type Viewer {
  name: String
  email: String!
}

"""
Which issues to list.

Terms are ANDed across keys. Within a key the semantics follow the field:
single-valued fields OR their terms, multi-valued fields AND theirs (spec 04).

A separate input from `PrFilter` rather than one input whose keys each apply
to one noun: spec 04 §4.3 requires a term describing the other kind to be
refused rather than to match nothing, and two inputs make that refusal the
validator's job instead of a check a resolver has to remember. GraphQL has no
input composition, so the keys both nouns share are written out twice.
"""
input IssueFilter {
  "Absent or empty means any status; the listing is not narrowed by one."
  status: [IssueStatus!]
  labels: [String!]
  assignees: [String!]
  authors: [String!]
  milestones: [String!]
  """
  Where the issue stands against its deadline; any one of them matches.

  Judged against the server's own day, in UTC.
  """
  deadline: [DeadlineState!]
  "Free text, matched against title, body and comments, and against the issue's own ID from four characters."
  text: [String!]
}

"Which pull requests to list. The twin of `IssueFilter`, which says why there are two."
input PrFilter {
  "Absent or empty means any status; the listing is not narrowed by one."
  status: [Status!]
  labels: [String!]
  assignees: [String!]
  authors: [String!]
  milestones: [String!]
  "Asked to review it; a pull request must name every one of them."
  reviewers: [String!]
  "The pull request's derived decision; any one of them matches."
  reviews: [ReviewDecision!]
  "Asked to review it and has not answered the latest revision."
  awaiting: [String!]
  "Free text, matched against title, body and comments, and against the pull request's own ID from four characters."
  text: [String!]
}

type Query {
  issues(filter: IssueFilter): [Issue!]!
  "`ref` is a full ID or an unambiguous prefix of at least four characters."
  issue(ref: ID!): Issue!
  """
  Pull requests recorded in the working tree.

  A pull request's files live on the branch it proposes to merge, so the
  working tree usually does not hold them: `allRefs` scans every fetched
  branch instead (spec 03 §3.5). That scan finds open pull requests only, so
  `allRefs` narrows the statuses on offer no matter what `filter` names.
  """
  prs(filter: PrFilter, allRefs: Boolean! = false): [Pr!]!
  pr(ref: ID!): Pr!
  doctor: DoctorReport!
  viewer: Viewer!
  "How this repository counts reviews (spec 02 §2.10)."
  reviewPolicy: ReviewPolicy!
  """
  Everyone this repository knows of, for the fields that name a person.

  Merged from three places and stored nowhere: the authors of the served
  checkout's history, with `.mailmap` honoured (spec 02 §2.4) and the clone's
  own committer left out, since it commits on everybody's behalf (§6.2);
  everyone the tree names as author, assignee, reviewer, merger or commenter,
  which is how somebody who has only ever worked through this API is known at
  all; and the signed-in viewer.

  One entry per address, compared case-insensitively, as RFC 5322 addresses
  sorted by what is shown — the display name, or the address where there is no
  name. A name comes from the first of those sources that has one, so the most
  recent commit names a person before a file does, and a file names one the
  history left bare.

  History is the served branch's alone: somebody whose only commits are on a
  branch this checkout does not hold is here through the tree, or not at all.

  Derived, disposable and never committed — the kind of index §6.6 permits —
  so it is a suggestion and not a registry: every person field still takes an
  address that is not in this list.
  """
  people: [String!]!
}

"What a mutation committed, and whether it reached the remote."
type CommitInfo {
  "False when the operation turned out to change nothing."
  committed: Boolean!
  subject: String!
  "False when the server runs without a remote, or committed nothing."
  pushed: Boolean!
}

input OpenIssueInput {
  title: String!
  body: String!
  labels: [String!]
  assignees: [String!]
  milestone: String
  "Where it sits in the queue; lower first (spec 02 §2.5)."
  rank: Float
  "When the work is wanted, `YYYY-MM-DD`."
  deadline: String
  "ID or prefix of the issue to file this one under."
  parent: ID
}

type OpenIssuePayload {
  issue: Issue!
  "The issue it was filed under, when one was named."
  parent: Issue
  commit: CommitInfo!
}

"""
Fields to change on an issue.

An omitted field is left alone. An explicit null clears the key, as does an
empty list for `labels` and `assignees`; `title` and `body` can be
replaced but not cleared. Frontmatter keys this schema does not name are always
preserved.
"""
input UpdateIssueInput {
  ref: ID!
  title: String
  body: String
  labels: [String!]
  assignees: [String!]
  milestone: String
  "Where it sits in the queue; an explicit null unplaces it (spec 02 §2.5)."
  rank: Float
  "When the work is wanted, `YYYY-MM-DD`; an explicit null undates it."
  deadline: String
  """
  The `baseSha` the edit was composed against, when it was composed against one.

  Optional: a listing that toggles a label or
  a drag that sets a rank has not read the file, and need not. Absent, the
  patch lands on the file as it is. Present, the patch is refused with
  `STALE_CONTENT` when a field it names has changed since — and only then, so
  a label set on an issue somebody has just retitled still lands. The refusal
  lists the fields that moved in `extensions.moved`, spelled as this input
  spells them. A token this server cannot resolve is stale by definition.
  """
  baseSha: String
}

type UpdateIssuePayload {
  issue: Issue!
  commit: CommitInfo!
}

"""
Fields to change on a pull request.

The twin of `UpdateIssueInput`, with the same absent-versus-null rules, plus
the people it asks to review. What a pull request *is* — its revisions, its
target, whether it merged — is not patchable here: appending a revision and
merging need a working tree on the branch and are not exposed (spec 06 §6.3).
Opening one is `openPr`.
"""
input UpdatePrInput {
  ref: ID!
  title: String
  body: String
  labels: [String!]
  assignees: [String!]
  reviewers: [String!]
  milestone: String
  "See `UpdateIssueInput.baseSha`."
  baseSha: String
}

type UpdatePrPayload {
  pr: Pr!
  commit: CommitInfo!
}

"""
Fields for a new pull request.

`source` is the branch carrying the commits, named without its remote. The
server does not need it checked out: it checks the branch out into a temporary
worktree of its clone, writes the pull request there — its files live on the
branch they propose to merge (spec 03 §3.5) — and pushes the branch. So the
branch has to be on the remote already.
"""
input OpenPrInput {
  source: String!
  "Branch to merge into; the repository's default branch when omitted."
  target: String
  title: String!
  body: String!
  "Mark it as not ready for review yet."
  draft: Boolean
  "Who to ask for a review (spec 02 §2.7)."
  reviewers: [String!]
  labels: [String!]
  assignees: [String!]
  milestone: String
}

type OpenPrPayload {
  "Read back from the branch it was written on, which `refs` names."
  pr: Pr!
  commit: CommitInfo!
}

input CloseIssueInput {
  ref: ID!
  "Why it ended, e.g. `fixed` or `wontfix`."
  resolution: String
  "ID or prefix of the issue this one duplicates."
  duplicateOf: ID
}

type CloseIssuePayload {
  issue: Issue!
  "Where it now lives, relative to the Navbook directory."
  destination: String!
  commit: CommitInfo!
}

type ReopenIssuePayload {
  issue: Issue!
  destination: String!
  commit: CommitInfo!
}

"""
A comment, or a review when a verdict is given.

Review fields are meaningful only on pull requests (§2.6), and `revision` binds
the review to one recorded state of the branch — the latest, unless named.

A comment is written beside the entity it belongs to. On a pull request the
server's checkout does not hold — one `prs(allRefs: true)` finds on another
branch — that is its branch: the comment is written in a temporary worktree
there, and the branch is pushed, as `openPr` does.
"""
input AddCommentInput {
  kind: Kind!
  ref: ID!
  body: String!
  "ID or prefix of the comment being replied to."
  replyTo: ID
  verdict: Verdict
  "Prefix of a recorded revision head; defaults to the latest."
  revision: String
  file: String
  "A line number or a `start-end` range."
  line: String
}

type AddCommentPayload {
  comment: Comment!
  entity: Entity!
  commit: CommitInfo!
}

input LinkIssueInput {
  "ID or prefix of the issue to file under another."
  child: ID!
  "ID or prefix of the issue it goes under."
  parent: ID!
  """
  Consent to move a subtask that already has a parent.

  Without it such a link fails with REPARENT_REQUIRED, naming the parent the
  issue has now — moving one changes a structure somebody else may be reading.
  """
  allowReparent: Boolean! = false
}

type LinkIssuePayload {
  child: Issue!
  parent: Issue!
  "The parent it was moved away from, when it had one."
  previousParentId: ID
  commit: CommitInfo!
}

type UnlinkIssuePayload {
  child: Issue!
  previousParentId: ID
  commit: CommitInfo!
}

type Mutation {
  openIssue(input: OpenIssueInput!): OpenIssuePayload!
  updateIssue(input: UpdateIssueInput!): UpdateIssuePayload!
  """
  Patch a pull request's metadata, `reviewers` included.

  One on a branch this checkout does not hold is patched on that branch, in a
  temporary worktree, and the branch is pushed; see `openPr`.
  """
  updatePr(input: UpdatePrInput!): UpdatePrPayload!
  """
  Open a pull request on `source`, and push that branch.

  Refused with `PRECONDITION` when `source` is not a branch on the remote, is
  checked out in a worktree somebody else made, equals `target`, or shares no
  history with it; with `SYNC_CONFLICT` when the server's copy of the branch
  cannot be merged with the remote's.
  """
  openPr(input: OpenPrInput!): OpenPrPayload!
  closeIssue(input: CloseIssueInput!): CloseIssuePayload!
  reopenIssue(ref: ID!): ReopenIssuePayload!
  addComment(input: AddCommentInput!): AddCommentPayload!
  linkIssue(input: LinkIssueInput!): LinkIssuePayload!
  unlinkIssue(ref: ID!): UnlinkIssuePayload!
}
