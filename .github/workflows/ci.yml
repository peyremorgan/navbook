name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: lint + typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      # Types are generated from schema.graphql and committed, so that
      # development needs no build step — the server's resolvers and the web
      # client's documents both. This is what keeps them honest.
      - name: the generated types must match the schema
        run: pnpm -r --if-present codegen:check

  test:
    name: test (node ${{ matrix.node }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [24, 26]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: configure git identity
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@example.invalid"
          git config --global init.defaultBranch main
      - run: pnpm test

  web-e2e:
    name: web end-to-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The suite builds a repository and a server that commits to it, so git
      # needs to know who it is — as the other jobs do, and for the same reason.
      - name: configure git identity
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@example.invalid"
          git config --global init.defaultBranch main
      - run: pnpm --filter @navbook/web exec playwright install --with-deps chromium
      # The generated bundle is what the suite serves, because it is what gets
      # deployed: a dev server has no SPA fallback to prove.
      - run: pnpm --filter @navbook/web build
      - run: pnpm --filter @navbook/web test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: packages/web/playwright-report
          retention-days: 7

  build:
    name: build + pack smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: configure git identity
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@example.invalid"
          git config --global init.defaultBranch main
      - name: conformance suite against the built CLI
        run: NAV_BIN="node $PWD/packages/cli/dist/main.js" pnpm test:conformance
      - name: performance budget against the built CLI
        run: NAV_BIN="node $PWD/packages/cli/dist/main.js" pnpm bench
      - name: server suite against the built server
        run: |
          NAV_SERVER_BIN="node $PWD/packages/server/dist/main.js" \
            pnpm --filter @navbook/server test

      # The steps above still resolve @navbook/core through the workspace link,
      # so they exercise dist over sources. Installing both tarballs into a
      # scratch project is what proves the published artifacts work on their
      # own — including publishConfig.exports and the workspace: rewrite.
      - name: install both tarballs and run the CLI
        run: |
          pnpm --filter @navbook/core pack --pack-destination "$RUNNER_TEMP"
          pnpm --filter @navbook/cli pack --pack-destination "$RUNNER_TEMP"
          mkdir -p /tmp/smoke && cd /tmp/smoke && npm init -y >/dev/null
          # Core first: the cli tarball names a version that is not on the
          # registry yet, so it must already be installed to satisfy it.
          npm install --silent "$RUNNER_TEMP"/navbook-core-*.tgz
          npm install --silent "$RUNNER_TEMP"/navbook-cli-*.tgz
          git init -q -b main smoke && cd smoke
          ../node_modules/.bin/nav --version
          ../node_modules/.bin/nav init
          ../node_modules/.bin/nav issue open "Smoke test" -m "It runs."
          ../node_modules/.bin/nav doctor
      - name: conformance suite against the installed package
        run: NAV_BIN="node /tmp/smoke/node_modules/.bin/nav" pnpm test:conformance

  docker:
    name: container images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The seed repository below is made with `nav`, which commits.
      - name: configure git identity
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@example.invalid"
          git config --global init.defaultBranch main

      # `.env.example` is the file a deployment starts from, so it has to render
      # as it stands — a required key left empty there is a broken first run.
      - name: the descriptor renders against the example environment
        run: docker compose --env-file .env.example config --quiet

      # Through compose rather than two `docker build` commands, so the build
      # contexts the descriptor names are covered as well as the Dockerfiles.
      - name: both images build
        run: docker compose --env-file .env.example build

      - name: the web image serves what it was told, and deep links reach the app
        run: |
          docker run -d --name web-smoke -p 8080:80 \
            -e NAVBOOK_GRAPHQL_URL=https://api.smoke.invalid/graphql \
            -e NAVBOOK_OIDC_DISCOVERY_URL=https://accounts.smoke.invalid/.well-known/openid-configuration \
            -e NAVBOOK_OIDC_CLIENT_ID=navbook-web \
            -e NAVBOOK_OIDC_AUDIENCE=navbook \
            navbook-web:local
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8080/config.json > /dev/null && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8080/config.json | tee /tmp/config.json
          jq -e '.graphqlUrl == "https://api.smoke.invalid/graphql"' /tmp/config.json
          jq -e '.oidc.discoveryUrl == "https://accounts.smoke.invalid/.well-known/openid-configuration"' /tmp/config.json
          jq -e '.oidc.clientId == "navbook-web" and .oidc.audience == "navbook"' /tmp/config.json
          # Routing happens in the browser: a reload on a deep link has to find
          # the app rather than a 404.
          curl -fsS http://127.0.0.1:8080/issues/ab12cd34 | grep -q 'id="__nuxt"'
          # And a prerendered listing is served where it is asked for, not one
          # redirect away.
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/issues)" = 200

      - name: the API image makes its own clone and serves it
        run: |
          seed="$RUNNER_TEMP/seed"
          git init -q -b main "$seed"
          (cd "$seed" && node "$GITHUB_WORKSPACE/packages/cli/src/main.ts" init --commit)
          git clone -q --bare "$seed" "$RUNNER_TEMP/seed.git"
          # git refuses to serve a repository owned by somebody else, and the
          # container is uid 1000 while the runner is not.
          sudo chown -R 1000:1000 "$RUNNER_TEMP/seed.git"
          docker run -d --name api-smoke -p 4000:4000 \
            -v "$RUNNER_TEMP/seed.git:/seed.git" \
            -e NAVBOOK_REPO_URL=file:///seed.git \
            -e NAVBOOK_GIT_NAME="Navbook CI" \
            -e NAVBOOK_GIT_EMAIL=navbook@example.invalid \
            -e NAV_SERVER_OIDC_ISSUER=https://issuer.invalid \
            -e NAV_SERVER_OIDC_AUDIENCE=navbook \
            -e NAV_SERVER_OIDC_JWKS_URL=https://issuer.invalid/jwks \
            -e NAV_SERVER_GRAPHIQL=false \
            navbook-server:local
          for _ in $(seq 1 60); do
            curl -fsS http://127.0.0.1:4000/health > /dev/null && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:4000/health
          docker logs api-smoke 2>&1 | grep -q "nav-server listening"
          # Authentication has no off switch, and the identity provider above
          # does not exist: the refusal proves both that it answers and that it
          # never went looking for keys to start.
          curl -sS -X POST http://127.0.0.1:4000/graphql \
            -H 'content-type: application/json' \
            -d '{"query":"{issues{id}}"}' | grep -q UNAUTHENTICATED
          # A restart serves the clone it already has rather than making another.
          docker restart api-smoke
          for _ in $(seq 1 60); do
            curl -fsS http://127.0.0.1:4000/health > /dev/null && break
            sleep 1
          done
          docker logs api-smoke 2>&1 | grep -q "serving the clone already in"

      - name: what the containers said
        if: always()
        run: |
          docker logs web-smoke 2>&1 | tail -30 || true
          docker logs api-smoke 2>&1 | tail -30 || true
