name: Release

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    name: publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile

      - name: the tag must match both package versions
        run: |
          tagged="${GITHUB_REF_NAME#v}"
          for pkg in core cli; do
            packaged="$(node -p "require('./packages/$pkg/package.json').version")"
            if [ "$tagged" != "$packaged" ]; then
              echo "tag $GITHUB_REF_NAME does not match @navbook/$pkg version $packaged" >&2
              exit 1
            fi
          done

      - run: pnpm check
      - run: |
          git config --global user.name "CI"
          git config --global user.email "ci@example.invalid"
          git config --global init.defaultBranch main
      - run: pnpm test
      - run: pnpm build

      - name: the built CLI must pass the conformance suite too
        run: NAV_BIN="node $PWD/packages/cli/dist/main.js" pnpm test:conformance

      # Core first: the CLI depends on this exact version, so publishing it
      # second means the dependency is already resolvable on the registry.
      - run: pnpm --filter @navbook/core publish --access public --no-git-checks
        env:
          NPM_CONFIG_PROVENANCE: true
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - run: pnpm --filter @navbook/cli publish --access public --no-git-checks
        env:
          NPM_CONFIG_PROVENANCE: true
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
