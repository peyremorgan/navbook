name: Release

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    name: publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile

      - name: the tag must match both package versions
        run: |
          tagged="${GITHUB_REF_NAME#v}"
          for pkg in core cli; do
            packaged="$(node -p "require('./packages/$pkg/package.json').version")"
            if [ "$tagged" != "$packaged" ]; then
              echo "tag $GITHUB_REF_NAME does not match @navbook/$pkg version $packaged" >&2
              exit 1
            fi
          done

      - run: pnpm check
      - run: |
          git config --global user.name "CI"
          git config --global user.email "ci@example.invalid"
          git config --global init.defaultBranch main
      - run: pnpm test
      - run: pnpm build

      - name: the built CLI must pass the conformance suite too
        run: NAV_BIN="node $PWD/packages/cli/dist/main.js" pnpm test:conformance

      # Two tools, each doing what only it can. pnpm builds the tarballs
      # because only it applies publishConfig.exports and rewrites the
      # workspace: dependency to a real version; npm uploads them because only
      # it signs a publish with provenance. Publishing a finished tarball needs
      # neither rewrite, so nothing is lost in the handover.
      - name: build the tarballs
        run: |
          pnpm --filter @navbook/core pack --pack-destination "$RUNNER_TEMP"
          pnpm --filter @navbook/cli pack --pack-destination "$RUNNER_TEMP"

      - name: install both tarballs and run the CLI, as a consumer would
        run: |
          mkdir -p /tmp/smoke && cd /tmp/smoke && npm init -y >/dev/null
          npm install --silent "$RUNNER_TEMP"/navbook-core-*.tgz
          npm install --silent "$RUNNER_TEMP"/navbook-cli-*.tgz
          git init -q -b main smoke && cd smoke
          test "$(../node_modules/.bin/nav --version)" = "${GITHUB_REF_NAME#v}"
          ../node_modules/.bin/nav init
          ../node_modules/.bin/nav issue open "Release smoke test" -m "It runs."
          ../node_modules/.bin/nav doctor

      # Core first: the CLI depends on this exact version, so publishing it
      # second means the dependency is already resolvable on the registry.
      - name: publish @navbook/core
        run: npm publish "$RUNNER_TEMP"/navbook-core-*.tgz --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: publish @navbook/cli
        run: npm publish "$RUNNER_TEMP"/navbook-cli-*.tgz --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
