spec-version: 1
description: opening a pull request pins the exact head and merge base offered for review
history:
  - {id: base, branch: main, apply: history/00-base, message: "feat: initial code", date: 2026-08-01T10:00:00Z}
  - {id: feat, branch: feat/auth, from: base, apply: history/01-feat, message: "feat: rework auth tokens", date: 2026-08-04T16:00:00Z}
run:
  checkout: feat/auth
  command: [pr, open, --title, "Refactor auth token handling", -m, "Replaces the ad-hoc token cache."]
  env: {NAV_NOW: "2026-08-04T16:40:00Z", NAV_IDS: "dk3mp2x9"}
expect:
  exit: 0
  stdout: expected/stdout.txt
  tree: expected/tree
