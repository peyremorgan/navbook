spec-version: 1
description: recording the same head twice is refused, since a revision must describe a new reviewable state
history:
  - {id: base, branch: main, apply: history/00-base, message: "feat: initial code", date: 2026-08-01T10:00:00Z}
  - {id: feat, branch: feat/auth, from: base, apply: history/01-feat, message: "feat: rework auth tokens", date: 2026-08-04T16:00:00Z}
run:
  checkout: feat/auth
  before:
    - nav: [pr, open, --title, "Refactor auth token handling", -m, "Replaces the ad-hoc token cache."]
      env: {NAV_NOW: "2026-08-04T16:40:00Z"}
  command: [pr, update, dk3m]
  env: {NAV_NOW: "2026-08-06T09:30:00Z", NAV_IDS: "dk3mp2x9"}
expect:
  exit: 1
  stdout: ""
  stderr-contains: ["already the latest recorded revision"]
