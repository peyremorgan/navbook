spec-version: 1
description: filing an issue mints an id, slugs the title, and reports the path
init: {from: before}
run:
  command: [issue, open, "Cache is never invalidated", -m, "Stale entries survive a deploy."]
  env: {NAV_NOW: "2026-08-10T12:00:00Z", NAV_IDS: "w2rfk8na"}
expect: {exit: 0, stdout: expected/stdout.txt, tree: expected/tree, commits: []}
