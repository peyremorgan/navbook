spec-version: 1
description: labels, assignee and milestone are written as frontmatter; --commit wraps the change in an nb commit
init: {from: before}
run:
  command: [issue, open, "Rotate session keys", -m, "Keys outlive their sessions.", --label, security, --label, auth, --assignee, "ked@example.com", --milestone, v1, --commit]
  env: {NAV_NOW: "2026-08-10T12:00:00Z", NAV_IDS: "w2rfk8na"}
expect:
  exit: 0
  stdout: expected/stdout.txt
  tree: expected/tree
  commits: ["nb: open #w2rfk8na\n"]
