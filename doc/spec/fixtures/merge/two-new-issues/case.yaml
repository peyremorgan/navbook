spec-version: 1
description: two issues filed independently never collide, because ids are random rather than sequential
history:
  - {id: base, branch: main, apply: history/00-base, message: "nb: initialize navbook", date: 2026-08-01T10:00:00Z}
  - {id: alice, branch: alice, from: base, apply: history/01-alice, message: "nb: open #aaa11111", date: 2026-08-05T10:00:00Z}
  - {id: bob, branch: bob, from: base, apply: history/02-bob, message: "nb: open #bbb22222", date: 2026-08-05T11:00:00Z}
run:
  checkout: alice
  git: [merge, --no-edit, bob]
expect:
  exit: 0
  tree: expected/tree
