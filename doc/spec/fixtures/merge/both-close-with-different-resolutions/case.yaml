  - {id: fixed, branch: fixed, from: base, apply: history/01-fixed, rm: [".navbook/issues/open/bqlybac0-login-timeout"], message: "docs(issue): close #bqlybac0", date: 2026-08-05T10:00:00Z}
  - {id: wontfix, branch: wontfix, from: base, apply: history/02-wontfix, rm: [".navbook/issues/open/bqlybac0-login-timeout"], message: "docs(issue): close #bqlybac0", date: 2026-08-05T11:00:00Z}
